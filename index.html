<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fila de Atendimento - Simulador</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>Simulador de Fila de Atendimento</h1>
      <p>Versão web baseada no algoritmo em C++ (prioridades: V, A, D, B).</p>
    </header>

    <section class="card">
      <h2>Chegada de paciente</h2>
      <form id="arrival-form" class="grid-form">
        <label>Senha
          <input type="number" id="senha" required min="1" />
        </label>

        <label>Prioridade
          <select id="prioridade" required>
            <option value="V">V</option>
            <option value="A">A</option>
            <option value="D">D</option>
            <option value="B">B</option>
          </select>
        </label>

        <label>Hora
          <input type="number" id="hora-chegada" required min="0" max="23" />
        </label>

        <label>Minuto
          <input type="number" id="minuto-chegada" required min="0" max="59" />
        </label>

        <button type="submit">Adicionar paciente</button>
      </form>
    </section>

    <section class="card">
      <h2>Atendimento</h2>
      <form id="service-form" class="grid-form">
        <label>Hora
          <input type="number" id="hora-atendimento" required min="0" max="23" />
        </label>

        <label>Minuto
          <input type="number" id="minuto-atendimento" required min="0" max="59" />
        </label>

        <button type="submit">Atender próximo paciente</button>
      </form>
    </section>

    <section class="card">
      <h2>Painel</h2>
      <div id="status" class="status">Nenhuma ação executada.</div>
      <ul id="stats"></ul>
      <button id="final-report-btn" class="secondary">Gerar relatório final</button>
      <pre id="final-report"></pre>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
